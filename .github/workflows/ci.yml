name: 'Verifica qualità del codice'
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verification:
    name: 'Static and Dynamic Analysis'
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: 1. Analisi Statica (ESLint & Prettier)
        run: npm run lint

      - name: 2. Analisi Dinamica e Test di Unità
        run: npm run test:cov

      - name: 3. Test di Integrazione (e2e)
        run: npm run test:e2e
        env:
          MONGO_URI: mongodb://localhost:27017/test-e2e-db

      - name: 4. SonarCloud Analysis
        uses: SonarSource/sonarcloud-github-action@master
        env:
            SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: 5. Verifica Integrità Build
        run: npm run build